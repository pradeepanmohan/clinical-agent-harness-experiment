name: Codex Label Dispatch

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  dispatch-implementation:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest

    steps:
      - name: Ask Codex to implement issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            const body = `@codex Execute this GitHub issue as a bounded agent harness task.

            Follow the repository instructions in AGENTS.md.

            Required context:
            - AGENTS.md
            - docs/PRD.md
            - docs/ARCHITECTURE.md
            - docs/HARNESS.md
            - docs/WORKFLOW.md
            - .harness/TASKS.json
            - .harness/PROGRESS.md
            - latest relevant evidence file under .harness/evidence/
            - the task file named in this issue, if present

            Rules:
            - Implement only the task described in this issue.
            - Respect the task's allowed-files list.
            - If the allowlist is incomplete, make the smallest policy correction and document it in evidence.
            - Prefer TDD for new behavior.
            - Run pnpm lint, pnpm typecheck, pnpm test, and pnpm build.
            - Include framework-level smoke coverage when changing NestJS routes/controllers/modules.
            - Write evidence under .harness/evidence/.
            - Open a pull request.
            - Do not merge.

            Issue title: ${issue.title}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
