name: Agent Implement

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Harness task id, for example S01"
        required: true
      task_file:
        description: "Task file path, for example .harness/tasks/S01-patient-crud.md"
        required: true

jobs:
  codex-implement:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Codex secret
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY repository secret is required before running Codex in GitHub Actions."
            exit 1
          fi

      - name: Run Codex for one bounded task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          npm install -g @openai/codex
          codex exec -C . --sandbox workspace-write --ignore-rules "
          You are executing one constrained agent harness task.

          Read these files first:
          - AGENTS.md
          - docs/PRD.md
          - docs/ARCHITECTURE.md
          - docs/HARNESS.md
          - docs/WORKFLOW.md
          - .harness/TASKS.json
          - .harness/PROGRESS.md
          - .harness/evidence/S01-patient-crud.md
          - ${TASK_FILE}

          Rules:
          - Implement only ${TASK_ID}.
          - Do not touch files outside the task's allowed changes.
          - Prefer TDD for new behavior.
          - Run verification commands.
          - Write evidence to .harness/evidence/${TASK_ID}.md or the path named by the task file.
          - Stop after implementation and evidence.
          - Do not push.
          - Do not merge.
          "

      - name: Verify after Codex
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: agent/${{ inputs.task_id }}
          title: "Agent task: ${{ inputs.task_id }}"
          body: |
            Codex executed harness task `${{ inputs.task_id }}`.

            Review the evidence file under `.harness/evidence/` and verify the diff against the task contract.
