name: Sandcastle Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to implement"
        required: true
        type: string

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent:sandcastle'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sandcastle-issue-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SANDCASTLE_IMAGE_NAME: sandcastle:clinical-agent-harness
      SANDCASTLE_AGENT_MODEL: claude-sonnet-4-5

    steps:
      - name: Resolve issue number
        id: issue
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            issue_number='${{ inputs.issue_number }}'
          else
            issue_number='${{ github.event.issue.number }}'
          fi
          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number: $issue_number" >&2
            exit 1
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Preflight Claude Code token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Sandcastle refused to run: missing repository secret \`CLAUDE_CODE_OAUTH_TOKEN\`. Add the secret, then re-run this workflow or re-add \`agent:sandcastle\`."
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sandcastle image
        run: |
          docker build \
            --build-arg AGENT_UID=$(id -u) \
            --build-arg AGENT_GID=$(id -g) \
            -t "$SANDCASTLE_IMAGE_NAME" \
            -f .sandcastle/Dockerfile \
            .

      - name: Prepare issue context
        id: context
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p .sandcastle/runtime
          gh issue view "$ISSUE_NUMBER" --comments --json number,title,body,labels,comments > .sandcastle/runtime/issue.json
          node <<'NODE'
          const fs = require('node:fs');
          const issue = JSON.parse(fs.readFileSync('.sandcastle/runtime/issue.json', 'utf8'));
          const labels = issue.labels.map((label) => label.name).join(', ');
          const comments = issue.comments
            .map((comment, index) => `## Comment ${index + 1} by ${comment.author.login}\n\n${comment.body}`)
            .join('\n\n');
          const markdown = `# Issue #${issue.number}: ${issue.title}\n\nLabels: ${labels}\n\n## Body\n\n${issue.body || '(no body)'}\n\n${comments ? `# Comments\n\n${comments}` : ''}\n`;
          fs.writeFileSync('.sandcastle/runtime/issue-context.md', markdown);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${issue.title.replace(/%/g, '%25').replace(/\n/g, '%0A').replace(/\r/g, '%0D')}\n`);
          NODE

      - name: Compute branch name
        id: branch
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.context.outputs.title }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          if [ -z "$slug" ]; then slug="task"; fi
          branch="sandcastle/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run Sandcastle implementation agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.context.outputs.title }}
          ISSUE_CONTEXT_FILE: .sandcastle/runtime/issue-context.md
          SANDCASTLE_BRANCH: ${{ steps.branch.outputs.name }}
          SANDCASTLE_BASE_BRANCH: origin/main
          SANDCASTLE_RESULT_FILE: .sandcastle/runtime/sandcastle-result.json
        run: pnpm sandcastle:issue

      - name: Verify Sandcastle produced commits
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git show-ref --verify "refs/heads/$BRANCH"
          commit_count=$(git rev-list --count "origin/main..$BRANCH")
          if [ "$commit_count" -eq 0 ]; then
            echo "Sandcastle branch has no commits over origin/main." >&2
            exit 1
          fi
          git log --oneline "origin/main..$BRANCH"

      - name: Push Sandcastle branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --force-with-lease origin "$BRANCH"

      - name: Open draft PR
        id: pr
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.context.outputs.title }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/sandcastle-pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the Sandcastle runner workflow."
            echo
            echo "This PR is opened as a draft because a human still owns review, acceptance, and merge."
          } > "$body_file"
          title="Sandcastle #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          title="${title:0:256}"
          pr_url=$(gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body_file")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --body "Sandcastle opened draft PR: $pr_url"

      - name: Cleanup labels after success
        if: success() && github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:sandcastle" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true

      - name: Mark blocked on failure
        if: failure()
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Sandcastle run failed. Workflow run: $RUN_URL. Re-run the workflow or re-add \`agent:sandcastle\` after fixing the blocker." || true
