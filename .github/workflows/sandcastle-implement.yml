name: Sandcastle Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to implement"
        required: true
        type: string

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent:implement' ||
      github.event.label.name == 'agent:fix' ||
      github.event.label.name == 'agent:sandcastle'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sandcastle-issue-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SANDCASTLE_IMAGE_NAME: sandcastle:clinical-agent-harness
      SANDCASTLE_AGENT_MODEL: claude-sonnet-4-5

    steps:
      - name: Resolve issue number
        id: issue
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            issue_number='${{ inputs.issue_number }}'
          else
            issue_number='${{ github.event.issue.number }}'
          fi
          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number: $issue_number" >&2
            exit 1
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Preflight Claude Code token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Sandcastle refused to run: missing repository secret \`CLAUDE_CODE_OAUTH_TOKEN\`. Add the secret, then re-run this workflow or re-add \`agent:implement\`."
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CODEX_DISPATCH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sandcastle image
        run: |
          docker build \
            --build-arg AGENT_UID=$(id -u) \
            --build-arg AGENT_GID=$(id -g) \
            -t "$SANDCASTLE_IMAGE_NAME" \
            -f .sandcastle/Dockerfile \
            .

      - name: Compute branch name
        id: branch
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)
          slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          if [ -z "$slug" ]; then slug="task"; fi
          branch="sandcastle/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "title=${title//%/%25}" | sed ':a;N;$!ba;s/\n/%0A/g;s/\r/%0D/g' >> "$GITHUB_OUTPUT"

      - name: Resolve run mode and base branch
        id: base
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          mode="implement"
          base="origin/main"
          if [ "$LABEL_NAME" = "agent:fix" ]; then
            mode="fix"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
              base="origin/$BRANCH"
            else
              echo "agent:fix was requested, but $BRANCH does not exist yet. Falling back to origin/main."
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Prepare issue context
        id: context
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN_MODE: ${{ steps.base.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p .sandcastle/runtime
          gh issue view "$ISSUE_NUMBER" --comments --json number,title,body,labels,comments > .sandcastle/runtime/issue.json

          owner="${GH_REPO%%/*}"
          gh api "repos/${GH_REPO}/pulls" \
            --method GET \
            -f state="open" \
            -f head="${owner}:${BRANCH}" \
            > .sandcastle/runtime/open-prs.json

          pr_number=$(node -e "const fs=require('node:fs'); const prs=JSON.parse(fs.readFileSync('.sandcastle/runtime/open-prs.json','utf8')); console.log(prs[0]?.number ?? '')")
          if [ -n "$pr_number" ]; then
            gh pr view "$pr_number" --json number,title,body,baseRefName,headRefName,author,labels,commits,files,comments,reviews > .sandcastle/runtime/linked-pr.json
            gh pr checks "$pr_number" > .sandcastle/runtime/linked-pr-checks.txt || true
            gh pr diff "$pr_number" --patch > .sandcastle/runtime/linked-pr.diff || true
          else
            echo '{}' > .sandcastle/runtime/linked-pr.json
            : > .sandcastle/runtime/linked-pr-checks.txt
            : > .sandcastle/runtime/linked-pr.diff
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const issue = JSON.parse(fs.readFileSync('.sandcastle/runtime/issue.json', 'utf8'));
          const prs = JSON.parse(fs.readFileSync('.sandcastle/runtime/open-prs.json', 'utf8'));
          const pr = prs[0] ? JSON.parse(fs.readFileSync('.sandcastle/runtime/linked-pr.json', 'utf8')) : null;
          const checks = fs.readFileSync('.sandcastle/runtime/linked-pr-checks.txt', 'utf8').trim();
          const diff = fs.readFileSync('.sandcastle/runtime/linked-pr.diff', 'utf8').trim();
          const labels = issue.labels.map((label) => label.name).join(', ');
          const comments = issue.comments
            .map((comment, index) => `## Issue Comment ${index + 1} by ${comment.author.login}\n\n${comment.body}`)
            .join('\n\n');
          const prContext = pr
            ? `# Existing Pull Request #${pr.number}: ${pr.title}\n\nBase: ${pr.baseRefName}\nHead: ${pr.headRefName}\n\n## PR body\n\n${pr.body || '(no body)'}\n\n## PR checks\n\n${checks || '(none)'}\n\n## PR comments, including Sandcastle reviews\n\n${pr.comments.map((comment, index) => `### PR Comment ${index + 1} by ${comment.author.login}\n\n${comment.body}`).join('\n\n') || '(none)'}\n\n## Prior GitHub reviews\n\n${pr.reviews.map((review, index) => `### Review ${index + 1} by ${review.author.login}\n\nState: ${review.state}\n\n${review.body || ''}`).join('\n\n') || '(none)'}\n\n## Current PR diff\n\n\`\`\`diff\n${diff || '(diff unavailable)'}\n\`\`\``
            : 'No existing PR is open for this issue branch yet.';
          const markdown = `# Issue #${issue.number}: ${issue.title}\n\nRun mode: ${process.env.RUN_MODE}\nLabels: ${labels}\n\n## Body\n\n${issue.body || '(no body)'}\n\n${comments ? `# Issue comments\n\n${comments}` : ''}\n\n# Linked PR context for fix/review loops\n\n${prContext}\n`;
          fs.writeFileSync('.sandcastle/runtime/issue-context.md', markdown);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${issue.title.replace(/%/g, '%25').replace(/\n/g, '%0A').replace(/\r/g, '%0D')}\n`);
          NODE

      - name: Run Sandcastle implementation agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.context.outputs.title }}
          ISSUE_CONTEXT_FILE: .sandcastle/runtime/issue-context.md
          SANDCASTLE_BRANCH: ${{ steps.branch.outputs.name }}
          SANDCASTLE_BASE_BRANCH: ${{ steps.base.outputs.base }}
          SANDCASTLE_RUN_MODE: ${{ steps.base.outputs.mode }}
          SANDCASTLE_RESULT_FILE: .sandcastle/runtime/sandcastle-result.json
        run: pnpm sandcastle:issue

      - name: Verify Sandcastle produced commits
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          git show-ref --verify "refs/heads/$BRANCH"
          commit_count=$(git rev-list --count "${BASE_BRANCH}..$BRANCH")
          if [ "$commit_count" -eq 0 ]; then
            echo "Sandcastle branch has no commits over ${BASE_BRANCH}." >&2
            exit 1
          fi
          git log --oneline "${BASE_BRANCH}..$BRANCH"

      - name: Resolve harness task id
        id: task
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          issue_text=$(gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n" + (.body // "")')
          task_id=$(printf '%s\n' "$issue_text" | grep -Eo 'S[0-9]{2}' | head -n 1 || true)
          if [ -z "$task_id" ]; then
            echo "Could not resolve task id from issue #${ISSUE_NUMBER}." >&2
            exit 1
          fi
          echo "id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Run harness discipline checks
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
          BASE_BRANCH: ${{ steps.base.outputs.base }}
        run: pnpm harness:check -- --task "$TASK_ID" --base "$BASE_BRANCH"

      - name: Push Sandcastle branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --force-with-lease origin "$BRANCH"

      - name: Trigger Verify for Sandcastle branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh workflow run Verify --ref "$BRANCH"

      - name: Open or reuse draft PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CODEX_DISPATCH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.context.outputs.title }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/sandcastle-pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the Sandcastle runner workflow."
            echo
            echo "This PR is opened as a draft because a human still owns final review, acceptance, and merge."
            echo
            echo "Automation loop: Verify must pass, then \`agent:review\` runs. If review returns COMMENT or REQUEST_CHANGES, the review workflow re-labels the issue with \`agent:fix\` for another Sandcastle implementation pass."
          } > "$body_file"
          title="Sandcastle #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          title="${title:0:256}"
          owner="${GH_REPO%%/*}"
          existing_payload=$(gh api "repos/${GH_REPO}/pulls" \
            --method GET \
            -f state="open" \
            -f head="${owner}:${BRANCH}")
          existing_url=$(node -e "const prs=JSON.parse(process.argv[1]); console.log(prs[0]?.html_url ?? '')" "$existing_payload")
          if [ -n "$existing_url" ]; then
            pr_url="$existing_url"
          else
            pr_url=$(gh api "repos/${GH_REPO}/pulls" \
              --method POST \
              -f title="$title" \
              -f head="$BRANCH" \
              -f base="main" \
              -f body="$(cat "$body_file")" \
              -F draft=true \
              --jq .html_url)
          fi
          pr_number="${pr_url##*/}"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --body "Sandcastle opened or updated draft PR: $pr_url"

      - name: Wait for PR Verify to pass before review
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks=$(gh pr checks "$PR_NUMBER" || true)
            echo "$checks"
            if echo "$checks" | grep -Eq '^verify[[:space:]]+pass'; then
              exit 0
            fi
            if echo "$checks" | grep -Eq '^verify[[:space:]]+fail'; then
              echo "PR Verify failed; not triggering review." >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for PR Verify to pass; not triggering review." >&2
          exit 1

      - name: Trigger automatic Sandcastle review
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
            --method POST \
            -f labels[]=agent:review >/dev/null
          gh issue comment "$ISSUE_NUMBER" --body "PR Verify passed. Sandcastle queued automatic review for ${PR_URL}."

      - name: Cleanup labels after success
        if: success() && github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:fix" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:sandcastle" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true

      - name: Mark blocked on failure
        if: failure()
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Sandcastle run failed. Workflow run: $RUN_URL. Re-run the workflow or re-add \`agent:implement\`/\`agent:fix\` after fixing the blocker." || true
