name: Codex Review Dispatch

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  dispatch-review:
    if: github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest

    steps:
      - name: Ask Codex to review pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;

            const body = `@codex review

            Review this pull request against the bounded agent harness contract.

            Required context:
            - AGENTS.md
            - docs/HARNESS.md
            - docs/WORKFLOW.md
            - .harness/TASKS.json
            - .harness/PROGRESS.md
            - relevant task file under .harness/tasks/
            - relevant evidence file under .harness/evidence/

            Check:
            - acceptance criteria coverage
            - allowed-files compliance
            - out-of-scope changes
            - test quality and framework-level smoke coverage where applicable
            - evidence quality
            - overengineering or scope creep

            Return blockers, warnings, and approval notes. Do not merge.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body
            });
