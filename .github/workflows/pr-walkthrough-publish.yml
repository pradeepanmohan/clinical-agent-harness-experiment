name: Publish PR Walkthrough

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing PR Walkthrough run ID containing the artifact.
        required: true
        type: string
      pr_number:
        description: PR number to comment on.
        required: true
        type: string
      publish_to_pages:
        description: Publish to gh-pages. Keep false for private/sensitive PRs.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr-walkthrough-publish-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish walkthrough and comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download walkthrough artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .harness/pr-walkthrough
          gh run download "${{ inputs.run_id }}" \
            --name "pr-walkthrough-${{ inputs.pr_number }}" \
            --dir .harness/pr-walkthrough
          test -f .harness/pr-walkthrough/index.html

      - name: Publish walkthrough preview to GitHub Pages
        id: pages
        if: ${{ inputs.publish_to_pages }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .harness/pr-walkthrough
          destination_dir: pr-walkthrough/pr-${{ inputs.pr_number }}
          keep_files: true

      - name: Comment with walkthrough location
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ inputs.run_id }}
          PUBLISH_TO_PAGES: ${{ inputs.publish_to_pages }}
        run: |
          set -euo pipefail
          marker="<!-- pr-walkthrough-preview -->"
          artifact_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pr-walkthrough/pr-${PR_NUMBER}/"
          body_file="${RUNNER_TEMP}/pr-walkthrough-comment.md"
          {
            echo "$marker"
            echo "## PR Walkthrough"
            echo
            echo "A static interactive PR walkthrough artifact was generated for this PR."
            echo
            echo "- Artifact run: ${artifact_url}"
            if [ "$PUBLISH_TO_PAGES" = "true" ]; then
              echo "- GitHub Pages preview: ${pages_url}"
              echo
              echo "Review the Pages URL only if this PR is safe to expose through the repository Pages settings."
            else
              echo "- GitHub Pages publishing was intentionally skipped. Download the artifact from the run above."
            fi
          } > "$body_file"
          existing_comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$marker\"))) | .id" | tail -n 1)"
          if [ -n "$existing_comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" -f body="$(cat "$body_file")"
          else
            gh pr comment "$PR_NUMBER" --body-file "$body_file"
          fi
