name: PR Walkthrough

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to visualize. Leave empty to use the triggering pull request.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: pr-walkthrough-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate walkthrough artifact
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          if [ -z "$pr_number" ]; then
            echo "This workflow needs a pull_request trigger or workflow_dispatch pr_number." >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static PR walkthrough
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm pr-walkthrough -- --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --out .harness/pr-walkthrough/index.html

      - name: Verify walkthrough artifact shape
        run: |
          set -euo pipefail
          test -f .harness/pr-walkthrough/index.html
          grep -q 'window.PR_WALKTHROUGH_D3_DATA' .harness/pr-walkthrough/index.html
          grep -q 'cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js' .harness/pr-walkthrough/index.html
          grep -q 'System overview' .harness/pr-walkthrough/index.html
          grep -q 'Data flow graph' .harness/pr-walkthrough/index.html
          grep -q 'Code dependency graph' .harness/pr-walkthrough/index.html
          grep -q 'User action graph' .harness/pr-walkthrough/index.html

      - name: Upload walkthrough artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-walkthrough-${{ steps.pr.outputs.number }}
          path: .harness/pr-walkthrough
          if-no-files-found: error
