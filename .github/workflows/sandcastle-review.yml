name: Sandcastle Review

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "GitHub pull request number to review"
        required: true
        type: string

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sandcastle-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SANDCASTLE_IMAGE_NAME: sandcastle:clinical-agent-harness
      SANDCASTLE_AGENT_MODEL: claude-sonnet-4-5
      SANDCASTLE_MAX_AUTO_FIXES: "3"

    steps:
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr_number='${{ inputs.pr_number }}'
          else
            pr_number='${{ github.event.pull_request.number }}'
          fi
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $pr_number" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Preflight Claude Code token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            gh pr comment "$PR_NUMBER" --body "Sandcastle review refused to run: missing repository secret \`CLAUDE_CODE_OAUTH_TOKEN\`. Add the secret, then re-run this workflow or re-add \`agent:review\`."
            exit 1
          fi

      - name: Checkout harness runner
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sandcastle image
        run: |
          docker build \
            --build-arg AGENT_UID=$(id -u) \
            --build-arg AGENT_GID=$(id -g) \
            -t "$SANDCASTLE_IMAGE_NAME" \
            -f .sandcastle/Dockerfile \
            .

      - name: Prepare PR review context
        id: context
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p .sandcastle/runtime
          gh pr view "$PR_NUMBER" --json number,title,body,baseRefName,headRefName,author,labels,commits,files,comments,reviews > .sandcastle/runtime/pr.json
          gh pr checks "$PR_NUMBER" > .sandcastle/runtime/pr-checks.txt || true
          gh pr diff "$PR_NUMBER" --patch > .sandcastle/runtime/pr.diff
          node <<'NODE'
          const fs = require('node:fs');
          const pr = JSON.parse(fs.readFileSync('.sandcastle/runtime/pr.json', 'utf8'));
          const checks = fs.readFileSync('.sandcastle/runtime/pr-checks.txt', 'utf8').trim();
          const diff = fs.readFileSync('.sandcastle/runtime/pr.diff', 'utf8');
          const labels = pr.labels.map((label) => label.name).join(', ');
          const files = pr.files.map((file) => `- ${file.path} (+${file.additions}/-${file.deletions})`).join('\n');
          const comments = pr.comments.map((comment, index) => `## Comment ${index + 1} by ${comment.author.login}\n\n${comment.body}`).join('\n\n');
          const reviews = pr.reviews.map((review, index) => `## Review ${index + 1} by ${review.author.login}\n\nState: ${review.state}\n\n${review.body || ''}`).join('\n\n');
          const issueMatch = (pr.body || '').match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
          const issueNumber = issueMatch?.[1] ?? '';
          const markdown = `# Pull Request #${pr.number}: ${pr.title}\n\nAuthor: ${pr.author.login}\nBase: ${pr.baseRefName}\nHead: ${pr.headRefName}\nLinked issue: ${issueNumber || '(not found)'}\nLabels: ${labels}\n\n## Body\n\n${pr.body || '(no body)'}\n\n## Files\n\n${files || '(none)'}\n\n## Checks\n\n${checks || '(none)'}\n\n# Comments\n\n${comments || '(none)'}\n\n# Prior Reviews\n\n${reviews || '(none)'}\n\n# Diff\n\n\`\`\`diff\n${diff}\n\`\`\`\n`;
          fs.writeFileSync('.sandcastle/runtime/pr-review-context.md', markdown);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `issue_number=${issueNumber}\n`);
          NODE

      - name: Run Sandcastle review agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_CONTEXT_FILE: .sandcastle/runtime/pr-review-context.md
          SANDCASTLE_REVIEW_FILE: .sandcastle/runtime/sandcastle-review.md
          SANDCASTLE_RESULT_FILE: .sandcastle/runtime/sandcastle-review-result.json
        run: pnpm sandcastle:review

      - name: Post Sandcastle review comment
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          test -s .sandcastle/runtime/sandcastle-review.md
          gh pr comment "$PR_NUMBER" --body-file .sandcastle/runtime/sandcastle-review.md

      - name: Resolve review verdict
        id: verdict
        run: |
          set -euo pipefail
          verdict=$(node <<'NODE'
          const fs = require('node:fs');
          const review = fs.readFileSync('.sandcastle/runtime/sandcastle-review.md', 'utf8');
          const match = review.match(/\*\*Verdict:\*\*\s*(APPROVE|COMMENT|REQUEST_CHANGES)/);
          console.log(match?.[1] ?? 'COMMENT');
          NODE
          )
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Review verdict: $verdict"

      - name: Cleanup review label after success
        if: success() && github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true

      - name: Queue automatic fix when review is not approved
        if: success() && steps.verdict.outputs.verdict != 'APPROVE'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          REVIEW_VERDICT: ${{ steps.verdict.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$ISSUE_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Sandcastle review returned ${REVIEW_VERDICT}, but no linked issue was found in the PR body, so automatic \`agent:fix\` was not queued. Workflow run: $RUN_URL"
            exit 0
          fi

          comments_json=$(gh pr view "$PR_NUMBER" --json comments)
          non_approve_count=$(node -e "const data=JSON.parse(process.argv[1]); console.log(data.comments.filter(c => c.body.includes('<!-- sandcastle-review -->') && (c.body.includes('**Verdict:** REQUEST_CHANGES') || c.body.includes('**Verdict:** COMMENT'))).length)" "$comments_json")
          echo "Non-approve Sandcastle review count: $non_approve_count"

          if [ "$non_approve_count" -gt "$SANDCASTLE_MAX_AUTO_FIXES" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            gh issue comment "$ISSUE_NUMBER" --body "Sandcastle stopped the automatic fix loop for PR #${PR_NUMBER}: ${non_approve_count} non-approve reviews exceeded max ${SANDCASTLE_MAX_AUTO_FIXES}. Human review needed. Latest review run: $RUN_URL"
            gh pr comment "$PR_NUMBER" --body "Automatic fix loop paused after ${non_approve_count} non-approve Sandcastle reviews. Human review needed before more agent fixes."
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" --body "Sandcastle review for PR #${PR_NUMBER} returned ${REVIEW_VERDICT}. Queueing \`agent:fix\` so the implementation agent addresses the latest review findings. Review run: $RUN_URL"
          gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/labels" \
            --method POST \
            -f labels[]=agent:fix >/dev/null

      - name: Leave PR ready for human final review when approved
        if: success() && steps.verdict.outputs.verdict == 'APPROVE'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Sandcastle review approved this PR. Automation stops here; human final review and merge are still required."

      - name: Comment on failure
        if: failure()
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Sandcastle review failed. Workflow run: $RUN_URL. Re-run the workflow or re-add \`agent:review\` after fixing the blocker." || true
